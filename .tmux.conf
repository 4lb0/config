set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Last on purpose: TPM sources in this order and the plugin prepends its 🧉
# segment to status-right, so it goes after dracula and continuum build theirs.
set -g @plugin '4lb0/mateinate'

set-option -g status-position top

set -g @dracula-border-contrast true
set -g @dracula-plugins "cpu-usage ram-usage time"
set -g @dracula-show-left-icon session
set -g @dracula-show-timezone false
set -g @dracula-day-month true

bind r source-file ~/.tmux.conf

# Set new panes to open in current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}" -l 40

set -g mouse on
set -g @yank_selection_mouse 'clipboard'

set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '120'
set -g @resurrect-capture-pane-contents 'on'

# Set window title
set-option -g set-titles on
set-option -g set-titles-string "#{session_name} | #{pane_title}"

# Add claude configs
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g bell-action any
set -g monitor-bell on

# Agent session picker (opencode/claude): C-Space opens the popup from any
# pane, except inside Vim/Neovim where the key is handed back to the editor
# (Coc refresh in insert mode, the same picker in normal mode: see init.vim).
# `m:*vim` is a glob, not a regex: it matches nvim and vim (and wrappers).
# `-H 00` sends the NUL byte a terminal sends for Ctrl-Space.
bind -n C-Space if-shell -F '#{m:*vim,#{pane_current_command}}' \
  'send-keys -H 00' \
  'display-popup -E -b rounded -w 90% -h 60% -T agents ~/bin/sessions-ls'
bind A display-popup -E -b rounded -w 90% -h 60% -T agents ~/bin/sessions-ls

# --- cliamp / ytopen: player de audio desde Firefox/consola ---
bind P run -b 'cliamp toggle'          # pausa/continuar desde cualquier lado
bind N run -b 'cliamp next'            # siguiente pista/episodio
bind m switch-client -t ♪               # saltar al player
bind Y run -b 'ytopen "$(pbpaste)"'    # reproducir el link del portapapeles

run '~/.tmux/plugins/tpm/tpm'
